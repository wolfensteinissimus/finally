# Run: docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
services:
  app:
    build:
      context: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      DB_PATH: /tmp/finally-test.db   # fresh DB on every run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      BASE_URL: http://app:8000
      CI: "true"
    depends_on:
      app:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
